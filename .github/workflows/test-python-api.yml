name: Python API Tests

on:
  workflow_call:
    inputs:
      ref:
        description: cartovista-cloud-restapi-python-clients ref to test
        required: false
        type: string
        default: main
      python-version:
        description: Python version used to run the tests
        required: false
        type: string
        default: "3.12"
      Host:
        description: Target host name or URL for live API tests
        required: true
        type: string
      Tenant:
        description: Target tenant URL code for live API tests
        required: true
        type: string
      API_ADMIN_TEST_EMAIL:
        description: Optional email override for workflow_dispatch
        required: false
        type: string
      API_TEST_PASSWORD:
        description: Optional password override for workflow_dispatch
        required: false
        type: string
      PORTAL_TEST_API_KEY:
        description: Optional API key override for workflow_dispatch
        required: false
        type: string
      PORTAL_TEST_SECRET_KEY:
        description: Optional secret key override for workflow_dispatch
        required: false
        type: string
      AllowMutation:
        description: Whether live tests may create and clean up resources
        required: false
        type: string
        default: "true"
    secrets:
      PAT:
        required: false
      API_ADMIN_TEST_EMAIL:
        required: true
      API_TEST_PASSWORD:
        required: true
      PORTAL_TEST_API_KEY:
        required: true
      PORTAL_TEST_SECRET_KEY:
        required: true

  workflow_dispatch:
    inputs:
      ref:
        description: cartovista-cloud-restapi-python-clients ref to test
        required: false
        type: string
        default: main
      python-version:
        description: Python version used to run the tests
        required: false
        type: string
        default: "3.12"
      Host:
        description: Target host name or URL for live API tests
        required: true
        type: string
      Tenant:
        description: Target tenant URL code for live API tests
        required: true
        type: string
      API_ADMIN_TEST_EMAIL:
        description: Optional email override for live API tests
        required: false
        type: string
      API_TEST_PASSWORD:
        description: Optional password override for live API tests
        required: false
        type: string
      PORTAL_TEST_API_KEY:
        description: Optional API key override for live API tests
        required: false
        type: string
      PORTAL_TEST_SECRET_KEY:
        description: Optional secret key override for live API tests
        required: false
        type: string
      AllowMutation:
        description: Whether live tests may create and clean up resources
        required: false
        type: string
        default: "true"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cartovista/cartovista-cloud-restapi-python-clients
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PAT || github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test-requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r test-requirements.txt

      - name: Validate live test configuration
        shell: pwsh
        env:
          CARTOVISTA_HOST: ${{ inputs.Host }}
          CARTOVISTA_TENANT: ${{ inputs.Tenant }}
          CARTOVISTA_API_ADMIN_EMAIL: ${{ inputs.API_ADMIN_TEST_EMAIL || secrets.API_ADMIN_TEST_EMAIL }}
          CARTOVISTA_API_TEST_PASSWORD: ${{ inputs.API_TEST_PASSWORD || secrets.API_TEST_PASSWORD }}
          CARTOVISTA_PORTAL_API_KEY: ${{ inputs.PORTAL_TEST_API_KEY || secrets.PORTAL_TEST_API_KEY }}
          CARTOVISTA_PORTAL_SECRET_KEY: ${{ inputs.PORTAL_TEST_SECRET_KEY || secrets.PORTAL_TEST_SECRET_KEY }}
        run: |
          $missing = @()
          foreach ($name in @(
            "CARTOVISTA_HOST",
            "CARTOVISTA_TENANT",
            "CARTOVISTA_API_ADMIN_EMAIL",
            "CARTOVISTA_API_TEST_PASSWORD",
            "CARTOVISTA_PORTAL_API_KEY",
            "CARTOVISTA_PORTAL_SECRET_KEY"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Live API tests are required, but missing: $($missing -join ', ')"
          }

          if (-not (Test-Path "test/fixtures/live_data_table.xlsx")) {
            throw "Required live Excel fixture is missing: test/fixtures/live_data_table.xlsx"
          }

          if (-not (Test-Path "test/fixtures/Supermarches.zip")) {
            throw "Required live upload fixture is missing: test/fixtures/Supermarches.zip"
          }

      - name: Run full test suite
        shell: pwsh
        env:
          CARTOVISTA_HOST: ${{ inputs.Host }}
          CARTOVISTA_TENANT: ${{ inputs.Tenant }}
          CARTOVISTA_API_ADMIN_EMAIL: ${{ inputs.API_ADMIN_TEST_EMAIL || secrets.API_ADMIN_TEST_EMAIL }}
          CARTOVISTA_API_TEST_PASSWORD: ${{ inputs.API_TEST_PASSWORD || secrets.API_TEST_PASSWORD }}
          CARTOVISTA_PORTAL_API_KEY: ${{ inputs.PORTAL_TEST_API_KEY || secrets.PORTAL_TEST_API_KEY }}
          CARTOVISTA_PORTAL_SECRET_KEY: ${{ inputs.PORTAL_TEST_SECRET_KEY || secrets.PORTAL_TEST_SECRET_KEY }}
          CARTOVISTA_LIVE_ALLOW_MUTATION: ${{ inputs.AllowMutation }}
          CARTOVISTA_REQUIRE_LIVE_CONFIG: "true"
        run: python -m unittest discover -s test -p "test_*.py" -v
